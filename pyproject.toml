[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-integrity-toolkit"
version = "0.1.1"
description = "Deterministic local file inspection and SHA-256 comparison."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "kouteichan" }]
keywords = ["sha256", "file-integrity", "measurement"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/kouteichan/file-integrity-toolkit-oss"
Issues = "https://github.com/kouteichan/file-integrity-toolkit-oss/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
